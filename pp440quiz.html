<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Which PP440 Fictional Place Should You Move To?</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap');

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Source Serif 4', 'Palatino Linotype', Georgia, serif;
    color: #e8e0d4;
    position: relative;
    overflow-x: hidden;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-20px) rotate(5deg); }
    50% { transform: translateY(-10px) rotate(-3deg); }
    75% { transform: translateY(-25px) rotate(2deg); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  @keyframes barGrow {
    from { width: 4%; }
  }

  .floating-emoji {
    position: fixed;
    font-size: 24px;
    opacity: 0.12;
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
  }

  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  .screen { display: none; }
  .screen.active { display: block; animation: slideUp 0.5s ease-out; }

  /* INTRO */
  .intro { text-align: center; padding-top: 60px; }
  .intro .globe { font-size: 48px; margin-bottom: 16px; }
  .intro h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .intro .subtitle {
    font-size: 15px;
    opacity: 0.5;
    font-style: italic;
    margin-bottom: 8px;
  }
  .place-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 32px 0;
  }
  .place-tag {
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    white-space: nowrap;
  }
  .start-btn {
    background: linear-gradient(135deg, #e8c547 0%, #d4a017 100%);
    color: #1a1a2e;
    border: none;
    border-radius: 12px;
    padding: 16px 48px;
    font-size: 18px;
    font-weight: 700;
    font-family: 'Playfair Display', Georgia, serif;
    cursor: pointer;
    margin-top: 12px;
    letter-spacing: 0.5px;
    transition: transform 0.2s;
  }
  .start-btn:hover { transform: scale(1.05); }
  .intro .fine-print {
    font-size: 12px;
    opacity: 0.35;
    margin-top: 24px;
  }

  /* QUIZ */
  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 40px;
  }
  .progress-track {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #e8c547, #d4a017);
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .progress-count {
    font-size: 13px;
    opacity: 0.4;
    white-space: nowrap;
  }
  .question-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 22px;
    font-weight: 600;
    line-height: 1.4;
    margin-bottom: 28px;
    color: #fff;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .quiz-option {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-align: left;
    font-size: 16px;
    line-height: 1.5;
    color: #e8e0d4;
    font-family: 'Source Serif 4', Georgia, serif;
    width: 100%;
    display: block;
  }
  .quiz-option:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.25);
    transform: translateX(6px);
  }
  .quiz-option.selected {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.4);
    transform: translateX(8px);
  }
  .quiz-option.faded { opacity: 0.4; pointer-events: none; }

  /* RESULT */
  .result { text-align: center; padding-top: 40px; }
  .result .label {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 3px;
    opacity: 0.4;
    margin-bottom: 20px;
  }
  .result .big-emoji {
    font-size: 72px;
    margin-bottom: 12px;
    animation: pulse 2s ease-in-out infinite;
  }
  .result h2 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 36px;
    font-weight: 700;
    margin-bottom: 4px;
    letter-spacing: -0.5px;
  }
  .result .tagline {
    font-size: 15px;
    font-style: italic;
    opacity: 0.5;
    margin-bottom: 28px;
  }
  .result-card {
    border-radius: 16px;
    padding: 24px 28px;
    text-align: left;
    line-height: 1.7;
    font-size: 16px;
    margin-bottom: 12px;
  }
  .result .vibe {
    font-size: 13px;
    opacity: 0.35;
    font-style: italic;
    margin-bottom: 32px;
  }
  .scores-box {
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 32px;
    text-align: left;
  }
  .scores-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0.4;
    margin-bottom: 14px;
  }
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .score-row .emoji { font-size: 16px; width: 24px; text-align: center; }
  .score-row .name { font-size: 13px; width: 100px; opacity: 0.7; }
  .score-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
  }
  .score-fill {
    height: 100%;
    border-radius: 3px;
    animation: barGrow 1s ease-out;
  }
  .score-row .num { font-size: 12px; opacity: 0.4; width: 20px; text-align: right; }
  .restart-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 36px;
    font-size: 15px;
    color: #e8e0d4;
    cursor: pointer;
    font-family: 'Source Serif 4', Georgia, serif;
    transition: all 0.3s;
  }
  .restart-btn:hover { background: rgba(255,255,255,0.14); }
</style>
</head>
<body>

<!-- Floating emojis -->
<div class="floating-emoji" style="left:8%;top:12%;animation-delay:0s;animation-duration:9s;">🌧️</div>
<div class="floating-emoji" style="left:75%;top:5%;animation-delay:1.2s;animation-duration:10s;">👑</div>
<div class="floating-emoji" style="left:20%;top:70%;animation-delay:2.4s;animation-duration:11s;">🥥</div>
<div class="floating-emoji" style="left:60%;top:55%;animation-delay:3.6s;animation-duration:8.5s;">🎳</div>
<div class="floating-emoji" style="left:90%;top:30%;animation-delay:4.8s;animation-duration:9.5s;">💸</div>
<div class="floating-emoji" style="left:40%;top:85%;animation-delay:6s;animation-duration:10.5s;">👽</div>
<div class="floating-emoji" style="left:55%;top:20%;animation-delay:7.2s;animation-duration:8s;">🌋</div>

<div class="container">

  <!-- INTRO SCREEN -->
  <div id="intro-screen" class="screen intro active">
    <div class="globe">🌍</div>
    <h1>Which PP440 Fictional Place<br>Should You Move To?</h1>
    <p class="subtitle">A deeply scientific &amp; peer-reviewed personality quiz</p>
    <div class="place-tags" id="place-tags"></div>
    <button class="start-btn" onclick="startQuiz()">Take the Quiz →</button>
    <p class="fine-print">7 questions · 2 minutes · life-changing results</p>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="screen">
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <span class="progress-count" id="progress-count"></span>
    </div>
    <h2 class="question-text" id="question-text"></h2>
    <div class="options" id="options"></div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="result-screen" class="screen result"></div>

</div>

<script>
const places = {
  depressia: {
    name: "Depressia", emoji: "🌧️",
    tagline: "Where fiscal policy is always on your mind",
    description: "You belong in Depressia — a nation wrestling with big questions about debt, stimulus, and the role of government. You're the type who reads the budget like a thriller novel. Sure, unemployment is high and the mood is gloomy, but someone with your pragmatic, policy-minded brain is exactly what they need. Bring an umbrella (metaphorically).",
    color: "#4A6FA5", accent: "#8FB8DE",
    vibe: "Thoughtful policy wonk energy"
  },
  ruritania: {
    name: "Ruritania", emoji: "👑",
    tagline: "Carbon markets, steel exports, and two-page memos",
    description: "Welcome to Ruritania — a nation with its own emissions trading scheme, a booming steel sector, and a government that insists policy memos never exceed two pages of 12-point Calibri. You're the type who thrives in institutional complexity: debating free allocation vs. auctioning permits, calculating CBAM surcharges, and writing briefs for extremely busy ministers. Your ideal Friday night? Optimising carbon pricing while the EU watches.",
    color: "#8B2252", accent: "#D4789C",
    vibe: "Senior policy analyst in Calibri energy"
  },
  nuttingAtoll: {
    name: "Nutting Atoll", emoji: "🥥",
    tagline: "Coconuts, parrots, and optimal taxation",
    description: "You're moving to Nutting Atoll! A tropical paradise where King Kanuta rules, opera-singing parrots serenade you at dawn, and the tax system is... a work in progress. You're someone who likes warm weather, quirky communities, and has strong opinions about Pigouvian taxes. Just watch out for the noise complaints.",
    color: "#2D8F5E", accent: "#7EDBA6",
    vibe: "Tropical economist on holiday energy"
  },
  alleybowlia: {
    name: "Alleybowlia", emoji: "🎳",
    tagline: "Where every weekend is league night",
    description: "Strike! You belong on the island of Alleybowlia, where bowling isn't just a hobby — it's a way of life. You're competitive, community-oriented, and you understand that the value of a super-smooth bowling ball is deeply personal. Just don't disappear under mysterious circumstances like A and G did...",
    color: "#D45B2C", accent: "#F4A574",
    vibe: "Enthusiastic hobbyist energy"
  },
  inflationia: {
    name: "Inflationia", emoji: "💸",
    tagline: "Your money moves fast — literally",
    description: "Welcome to Inflationia, where the currency (the Inflatio) changes hands 5 times a year and the central bank keeps everyone guessing. You're someone who thrives in fast-paced, ever-changing environments. You don't mind a little chaos — in fact, you find monetary policy genuinely exciting. Spend your Inflatios quickly.",
    color: "#B8860B", accent: "#F0D060",
    vibe: "Chaotic financial adrenaline energy"
  },
  planetZorp: {
    name: "Planet Zorp", emoji: "👽",
    tagline: "Consumption functions and zero government",
    description: "You've been assigned to Planet Zorp — a world where consumers behave mechanically, there's no government, and the Paradox of Thrift is a lived experience. You're a deep thinker who questions conventional wisdom. Why does saving more make everyone poorer? You'll spend your evenings staring at alien skies, pondering aggregate demand.",
    color: "#6B3FA0", accent: "#B88FE8",
    vibe: "Existential space economist energy"
  },
  krakatoa: {
    name: "Krakatoa", emoji: "🌋",
    tagline: "Lava-resistant umbrellas included",
    description: "You're heading to Krakatoa! An island where volcanic eruptions are just part of daily life and the government solves problems with patents and monopolies. You're resilient, innovative, and you see opportunity where others see molten rock. Your lava-resistant umbrella awaits. Don't forget to calculate the deadweight loss.",
    color: "#CC3333", accent: "#FF7766",
    vibe: "Fearless innovator energy"
  }
};

const questions = [
  {
    // Q1: depressia, nuttingAtoll, inflationia, planetZorp
    question: "It's Saturday morning. What are you doing?",
    options: [
      { text: "Reading the news with increasing concern", scores: { depressia: 3, krakatoa: 1 } },
      { text: "At the beach, doing absolutely nothing", scores: { nuttingAtoll: 3, alleybowlia: 1 } },
      { text: "Already on my third activity of the day", scores: { inflationia: 3, ruritania: 1 } },
      { text: "Overthinking the meaning of leisure", scores: { planetZorp: 3, nuttingAtoll: 1 } }
    ]
  },
  {
    // Q2: ruritania, alleybowlia, krakatoa, depressia
    question: "Your friend owes you £20. What do you do?",
    options: [
      { text: "Draft a formal repayment memo with subheadings", scores: { ruritania: 3, depressia: 1 } },
      { text: "Forgive it — relationships matter more than money", scores: { alleybowlia: 3, planetZorp: 1 } },
      { text: "Negotiate an equity stake in their next purchase", scores: { krakatoa: 3, inflationia: 1 } },
      { text: "Worry about what this means for your savings rate", scores: { depressia: 3, ruritania: 1 } }
    ]
  },
  {
    // Q3: nuttingAtoll, ruritania, krakatoa, alleybowlia
    question: "Pick a pet:",
    options: [
      { text: "An opera-singing parrot", scores: { nuttingAtoll: 3, inflationia: 1 } },
      { text: "A very loyal, very boring golden retriever", scores: { ruritania: 3, alleybowlia: 1 } },
      { text: "Something exotic and slightly dangerous", scores: { krakatoa: 3, planetZorp: 1 } },
      { text: "A whole bowling team counts as a pet, right?", scores: { alleybowlia: 3, depressia: 1 } }
    ]
  },
  {
    // Q4: ruritania, inflationia, alleybowlia, planetZorp
    question: "How do you feel about risk?",
    options: [
      { text: "I hedged my answer to this question", scores: { ruritania: 3, nuttingAtoll: 1 } },
      { text: "Risk is just volatility and volatility is exciting", scores: { inflationia: 3, krakatoa: 1 } },
      { text: "I once bet everything on a bowling tournament", scores: { alleybowlia: 3, nuttingAtoll: 1 } },
      { text: "Risk is an illusion in a deterministic universe", scores: { planetZorp: 3, depressia: 1 } }
    ]
  },
  {
    // Q5: depressia, nuttingAtoll, krakatoa, planetZorp
    question: "Your ideal dinner party conversation is about:",
    options: [
      { text: "Whether governments spend too much or too little", scores: { depressia: 3, ruritania: 1 } },
      { text: "That time a neighbour complained about parrot noise", scores: { nuttingAtoll: 3, alleybowlia: 1 } },
      { text: "A patent you're filing for a lava-proof invention", scores: { krakatoa: 3, inflationia: 1 } },
      { text: "Why nothing is real and GDP is a social construct", scores: { planetZorp: 3, krakatoa: 1 } }
    ]
  },
  {
    // Q6: depressia, inflationia, krakatoa, alleybowlia
    question: "Pick a holiday destination vibe:",
    options: [
      { text: "Somewhere rainy where you can journal about fiscal policy", scores: { depressia: 3, planetZorp: 1 } },
      { text: "A chaotic bazaar where prices change by the hour", scores: { inflationia: 3, nuttingAtoll: 1 } },
      { text: "Somewhere with active volcanoes", scores: { krakatoa: 3, depressia: 1 } },
      { text: "A small town with a legendary bowling alley", scores: { alleybowlia: 3, ruritania: 1 } }
    ]
  },
  {
    // Q7: ruritania, inflationia, nuttingAtoll, planetZorp
    question: "What's your relationship with money?",
    options: [
      { text: "I track every penny in a colour-coded spreadsheet", scores: { ruritania: 3, alleybowlia: 1 } },
      { text: "Easy come, easy go — it'll inflate away anyway", scores: { inflationia: 3, krakatoa: 1 } },
      { text: "I have strong opinions on how it should be taxed", scores: { nuttingAtoll: 3, depressia: 1 } },
      { text: "I think about the velocity of money more than my bank balance", scores: { planetZorp: 3, inflationia: 1 } }
    ]
  }
];

let currentQ = 0;
let scores = {};
let locked = false;

// Build intro tags
const tagsEl = document.getElementById('place-tags');
Object.values(places).forEach(p => {
  const span = document.createElement('span');
  span.className = 'place-tag';
  span.style.background = p.color + '33';
  span.style.border = '1px solid ' + p.color + '66';
  span.textContent = p.emoji + ' ' + p.name;
  tagsEl.appendChild(span);
});

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  // Re-trigger animation
  el.style.animation = 'none';
  el.offsetHeight;
  el.style.animation = '';
}

function startQuiz() {
  currentQ = 0;
  scores = {};
  locked = false;
  showScreen('quiz-screen');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('progress-fill').style.width = ((currentQ + 1) / questions.length * 100) + '%';
  document.getElementById('progress-count').textContent = (currentQ + 1) + '/' + questions.length;
  document.getElementById('question-text').textContent = q.question;

  const optionsEl = document.getElementById('options');
  optionsEl.innerHTML = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'quiz-option';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt, idx);
    optionsEl.appendChild(btn);
  });

  // Re-trigger slide animation on quiz screen
  const qs = document.getElementById('quiz-screen');
  qs.style.animation = 'none';
  qs.offsetHeight;
  qs.style.animation = 'slideUp 0.4s ease-out';
}

function selectOption(option, idx) {
  if (locked) return;
  locked = true;

  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach((btn, i) => {
    if (i === idx) btn.classList.add('selected');
    else btn.classList.add('faded');
  });

  Object.entries(option.scores).forEach(([place, val]) => {
    scores[place] = (scores[place] || 0) + val;
  });

  setTimeout(() => {
    locked = false;
    if (currentQ < questions.length - 1) {
      currentQ++;
      renderQuestion();
    } else {
      showResult();
    }
  }, 600);
}

function showResult() {
  let maxScore = 0, winner = 'nuttingAtoll';
  Object.entries(scores).forEach(([place, score]) => {
    if (score > maxScore) { maxScore = score; winner = place; }
  });

  const p = places[winner];
  const sorted = Object.entries(places)
    .map(([key, pl]) => ({ key, ...pl, score: scores[key] || 0 }))
    .sort((a, b) => b.score - a.score);

  const maxPossible = 21;

  let scoresHTML = sorted.map(s => {
    const pct = Math.max(4, (s.score / maxPossible) * 100);
    const fillBg = s.key === winner
      ? `linear-gradient(90deg, ${s.color}, ${s.accent})`
      : 'rgba(255,255,255,0.2)';
    return `
      <div class="score-row">
        <span class="emoji">${s.emoji}</span>
        <span class="name">${s.name}</span>
        <div class="score-track"><div class="score-fill" style="width:${pct}%;background:${fillBg}"></div></div>
        <span class="num">${s.score}</span>
      </div>`;
  }).join('');

  document.getElementById('result-screen').innerHTML = `
    <p class="label">Your new home is…</p>
    <div class="big-emoji">${p.emoji}</div>
    <h2 style="color:${p.accent}">${p.name}</h2>
    <p class="tagline">${p.tagline}</p>
    <div class="result-card" style="background:linear-gradient(135deg,${p.color}22,${p.color}11);border:1px solid ${p.color}44;">
      ${p.description}
    </div>
    <p class="vibe">✨ ${p.vibe}</p>
    <div class="scores-box">
      <p class="scores-label">Compatibility Scores</p>
      ${scoresHTML}
    </div>
    <button class="restart-btn" onclick="restart()">Retake Quiz ↺</button>
  `;

  showScreen('result-screen');
}

function restart() {
  showScreen('intro-screen');
}
</script>
</body>
</html>
